name: Deploy Node.js Backend + Frontend to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: elite_edition_website
        continue-on-error: true
        run: |
          npm install --legacy-peer-deps || npm install --force
          npm run build

      - name: Upload Frontend dist to EC2
        uses: appleboy/scp-action@v0.1.4
        continue-on-error: true
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "elite_edition_website/dist/*"
          target: "/home/ubuntu/elite_edition_website_dist"
          strip_components: 2

      - name: Deploy Backend to AWS EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            cd ${{ secrets.AWS_TARGET_DIR }}
            git stash || true
            git fetch origin main
            git reset --hard origin/main
            npm install --production --legacy-peer-deps || npm install --production || true
            pm2 restart all || pm2 restart 0 || npm start || true
