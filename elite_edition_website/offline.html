<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Offline - Elite Edition ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overscroll-behavior: contain;
    }
    .offline-card {
      max-width: 400px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.9375rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    button {
      margin-top: 8px;
      min-height: 44px;
      width: 100%;
      background: #f8fafc;
      color: #0f172a;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>Elite Edition ERP</h1>
    <p>You are currently offline. Check your internet connection to continue working.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
