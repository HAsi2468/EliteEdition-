name: Security Quality Gate & Injection Remediation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── JOB 1: Static Application Security Testing (SAST) ───────────────────
  sast-semgrep-scan:
    name: Semgrep SAST & Injection Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Perform Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten
            p/xss
            p/sql-injection
            p/nosql-injection

  # ─── JOB 2: Automated Injection Regression & Fuzzing Suite ───────────────
  automated-injection-tests:
    name: Injection Fuzzing & Regression Tests (SEC-INJ 01-05)
    runs-on: ubuntu-latest
    needs: sast-semgrep-scan
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v18.x)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: EliteEditionMongo/package-lock.json

      # Backend Injection & Concurrency Verification
      - name: Install Backend Dependencies
        working-directory: ./EliteEditionMongo
        run: npm ci

      - name: Run Backend Injection Regression & Fuzzing Suite
        working-directory: ./EliteEditionMongo
        run: |
          echo "Executing SEC-INJ-01 through SEC-INJ-05 test verification..."
          npm test

      # Frontend Escaping & Input Sanitizer Verification
      - name: Install Frontend Dependencies
        working-directory: ./elite_edition_website
        run: npm ci

      - name: Run Frontend Security Engine Tests
        working-directory: ./elite_edition_website
        run: npm test -- --run

  # ─── JOB 3: Dynamic Application Security Testing (DAST / OWASP ZAP) ──────
  dast-owasp-zap-baseline:
    name: OWASP ZAP Dynamic Injection Baseline Scan
    runs-on: ubuntu-latest
    needs: automated-injection-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Start Local Test Backend
        working-directory: ./EliteEditionMongo
        run: |
          npm ci
          node src/index.js &
          echo "Waiting for local instance to become healthy..."
          sleep 5

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:3001/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -m 2'
          fail_action: true
